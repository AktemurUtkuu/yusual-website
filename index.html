<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Yusual'ın Kick kanalı ve sosyal medya hesapları."
    >
    <meta name="theme-color" content="#040506">

    <title>Yusual | Kick ve Sosyal Medya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    >
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="background" aria-hidden="true">
      <span class="hero-light"></span>
      <span class="hero-grid"></span>
      <span class="grain"></span>
    </div>

    <main class="profile-card">
      <header class="profile-header">
        <div class="avatar-frame">
          <img
            class="avatar"
            src="assets/yusual-profile.jpg"
            alt="Yusual profil fotoğrafı"
            width="108"
            height="108"
          >
          <span class="status-dot" title="Kick" aria-hidden="true"></span>
        </div>

        <span class="eyebrow">Kick Streamer</span>
        <h1>yusual</h1>
        <p class="tagline">Kick'te canlı yayın · watch party · oyun · sohbet</p>
      </header>

      <section class="primary-action" aria-labelledby="kick-heading">
        <h2 id="kick-heading">Sen de aramıza katıl, eğlenceyi yakından takip et !</h2>

        <a
          class="kick-button"
          href="kick-web.html"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual Kick kanalını web tarayıcısında yeni sekmede aç"
        >
          <span class="kick-logo" aria-hidden="true">KICK</span>
          <span class="button-copy">
            <strong>Sende aramıza katıl</strong>
            <small>@yusual</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      </section>

      <nav class="social-links" aria-label="Sosyal medya bağlantıları">
        <a
          class="social-link social-link--instagram"
          href="https://www.instagram.com/yyucel.k"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual Instagram profilini yeni sekmede aç"
        >
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
            </svg>
          </span>
          <span class="button-copy">
            <strong>Instagram</strong>
            <small>@yyucel.k</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a
          class="social-link social-link--tiktok"
          href="https://www.tiktok.com/@yyucel.k"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual TikTok profilini yeni sekmede aç"
        >
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M15.5 2h2.7c.25 1.45.95 2.65 2 3.55A6.8 6.8 0 0 0 24 6.95v2.8a9.5 9.5 0 0 1-5.5-1.8v7.15A6.9 6.9 0 1 1 11.6 8.2c.45 0 .9.05 1.3.12v2.85a4.1 4.1 0 1 0 2.6 3.82V2Z"/>
            </svg>
          </span>
          <span class="button-copy">
            <strong>TikTok</strong>
            <small>@yyucel.k</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a
          class="social-link social-link--youtube"
          href="https://youtube.com/@yyucel.k"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual YouTube kanalını yeni sekmede aç"
        >
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.55 3.6 12 3.6 12 3.6s-7.55 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.85.5 9.4.5 9.4.5s7.55 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.25 3.6-6.25 3.6Z"/>
            </svg>
          </span>
          <span class="button-copy">
            <strong>YouTube</strong>
            <small>@yyucel.k</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a
          class="social-link social-link--x"
          href="https://x.com/yyucelk5"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual X profilini yeni sekmede aç"
        >
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M18.25 2h3.68l-8.05 9.2L23.35 22h-7.42l-5.8-7.6L3.48 22H-.2l8.58-9.8L-.7 2h7.6l5.25 6.95L18.25 2Zm-1.3 18.1h2.04L5.8 3.8H3.6l13.35 16.3Z"/>
            </svg>
          </span>
          <span class="button-copy">
            <strong>X</strong>
            <small>@yyucelk5</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a
          class="social-link social-link--discord"
          href="https://discord.gg/n3SXTzCv5"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Yusual Discord topluluğunu yeni sekmede aç"
        >
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20.3 5.4A17.7 17.7 0 0 0 15.9 4l-.55 1.1a16.1 16.1 0 0 0-6.7 0L8.1 4a17.7 17.7 0 0 0-4.4 1.4C.9 9.3.1 13.1.4 16.8a17.8 17.8 0 0 0 5.4 2.7l1.3-1.75a11.6 11.6 0 0 1-1.9-.9l.5-.4a12.6 12.6 0 0 0 12.6 0l.5.4c-.6.35-1.2.65-1.9.9l1.3 1.75a17.8 17.8 0 0 0 5.4-2.7c.4-4.3-.7-8-3.3-11.4ZM8.8 14.8c-.95 0-1.7-.85-1.7-1.9S7.85 11 8.8 11s1.7.85 1.7 1.9-.75 1.9-1.7 1.9Zm6.4 0c-.95 0-1.7-.85-1.7-1.9s.75-1.9 1.7-1.9 1.7.85 1.7 1.9-.75 1.9-1.7 1.9Z"/>
            </svg>
          </span>
          <span class="button-copy">
            <strong>Discord</strong>
            <small>Topluluğa katıl</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      </nav>

      <footer>
        <p><span>Yusual</span><i aria-hidden="true">|</i><span>Kick yayıncısı</span></p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
